<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>bluxli — interactive site</title>
    <meta name="description" content="Personal interactive site for bluxli — advanced Three.js cube, mini-games, animations." />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta property="og:title" content="bluxli — interactive site" />
    <meta property="og:description" content="Interactive Three.js experience & mini-games." />
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/301450125?v=4" />
  </head>
  <body>
    <div id="ui">
      <header class="topbar">
        <div class="brand">
          <div class="avatar-bubble">._.</div>
          <div class="display-name" id="display-name">bluxli</div>
        </div>
        <div class="controls">
          <button id="openSettings" title="Settings">⚙️</button>
          <button id="snapshotBtn" title="Download snapshot">📸</button>
          <button id="wallpaperBtn" title="Download wallpaper">🖼️</button>
          <button id="startRotateMatch">Rotate Match</button>
          <button id="spawnTargetCube">Spawn Target</button>
          <button id="resetScene">Reset</button>
        </div>
      </header>

      <aside class="panel">
        <h3>Mini-games</h3>
        <div class="games-list" id="gamesList"></div>
        <div class="stats">
          <div>Score: <span id="score">0</span></div>
          <div id="gameHint">Tip: drag to rotate, click to interact.</div>
        </div>
      </aside>
    </div>

    <main id="canvas-container"></main>

    <div id="settings" class="overlay hidden">
      <h3>Settings</h3>
      <label><input type="checkbox" id="toggleSound"> Sound (soft ambient) — OFF for now</label>
      <label><input type="checkbox" id="toggleLDM"> Low Detail Mode (LDM)</label>
      <label><input type="checkbox" id="toggleFullMobile" checked> Full Effects on Mobile</label>
      <button id="resetScores">Reset High Scores</button>
      <button id="closeSettings">Close</button>
      <div class="small">LDM reduces particle count & detail for performance. Sound is disabled by default (you asked for no audio).</div>
    </div>

    <footer class="footer">Made with Three.js • Your OC-inspired gradient glass cube — <strong>bluxli</strong></footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
